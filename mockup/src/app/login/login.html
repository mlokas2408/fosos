<div class="login-shell grid h-dvh w-dvw overflow-hidden md:grid-cols-2">
  <!-- Brand column -->
  <aside class="login-brand relative hidden overflow-hidden text-white md:flex md:flex-col" aria-hidden="true">
    <div class="login-brand-wash absolute inset-0"></div>
    <div class="login-brand-grid absolute inset-0"></div>
    <div class="login-brand-glow absolute inset-0"></div>

    <div class="login-brand-content relative z-10 flex h-full flex-col justify-between p-10 xl:p-16">
      <div class="login-brand-mark flex items-center gap-3">
        <app-fos-mark size="lg" />
        <span class="text-sm tracking-[0.2em] uppercase opacity-70">{{ brand.liveLabel }}</span>
      </div>

      <div class="login-brand-hero max-w-md">
        <div class="text-5xl tracking-tight xl:text-6xl">
          <span class="font-medium">Fos</span><span class="font-normal opacity-90">OS</span>
        </div>
        <p class="mt-4 text-lg tracking-[0.14em] uppercase opacity-80">{{ brand.tagline }}</p>
        <p class="mt-3 text-sm tracking-wide opacity-60">{{ brand.motto }}</p>
        <p class="mt-8 max-w-sm text-sm leading-relaxed opacity-45">{{ brand.etymology }}</p>
      </div>

      <p class="text-xs tracking-wide opacity-40">Lightweight desktop for focus and delivery.</p>
    </div>
  </aside>

  <!-- Form column -->
  <main class="login-form relative flex flex-col">
    <div class="login-form-ambient absolute inset-0" aria-hidden="true"></div>

    <div class="relative z-10 flex flex-1 flex-col justify-center px-8 py-12 sm:px-12 lg:px-16 xl:px-24">
      <div class="login-form-panel mx-auto w-full max-w-[22rem]">
        <div class="mb-10 flex items-center gap-3 md:hidden">
          <app-fos-mark size="md" />
          <div>
            <div class="text-lg tracking-tight">
              <span class="font-medium">Fos</span><span class="font-normal opacity-80">OS</span>
            </div>
            <div class="text-muted-foreground text-[11px] tracking-[0.16em] uppercase">
              {{ brand.tagline }}
            </div>
          </div>
        </div>

        <div class="login-form-intro mb-8">
          <h1 class="text-2xl font-medium tracking-tight">Sign in</h1>
          <p class="text-muted-foreground mt-2 text-sm leading-relaxed">
            Continue to your FosOS session.
          </p>
        </div>

        <form class="flex flex-col gap-5" (submit)="onSubmit($event)">
          <div class="flex flex-col gap-1.5">
            <label class="text-foreground text-xs font-medium" for="login-username">Username</label>
            <input
              id="login-username"
              hlmInput
              name="username"
              type="text"
              autocomplete="username"
              class="h-9"
              [ngModel]="username()"
              (ngModelChange)="username.set($event)"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-foreground text-xs font-medium" for="login-password">Password</label>
            <input
              id="login-password"
              hlmInput
              name="password"
              type="password"
              autocomplete="current-password"
              class="h-9"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              placeholder="Optional on live media"
            />
          </div>

          <button
            hlmBtn
            type="submit"
            size="lg"
            class="mt-2 h-10 w-full"
            [disabled]="submitting() || !username().trim()"
          >
            {{ submitting() ? 'Signing in…' : 'Sign in' }}
          </button>
        </form>

        <p class="text-muted-foreground mt-8 text-[11px] leading-relaxed tracking-wide">
          Live session · no account required · {{ brand.motto }}
        </p>
      </div>
    </div>
  </main>
</div>
