[Globals]
; FosOS Remote Desktop — Windows-like separate-session host (xrdp).
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
certificate=
key_file=
ssl_protocols=TLSv1.2, TLSv1.3
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

;
; Window chrome colors — keep borders invisible on the dark Dawn field.
; (xrdp draws dialog frames from these named colors.)
;
black=0a0a0a
grey=0a0a0a
dark_grey=0a0a0a
blue=e5e5e5
dark_blue=a1a1a1
white=fafafa
red=ff6467
green=a1a1a1
background=0a0a0a

;
; Login screen — square FosOS card on Dawn Aperture field.
; Labels are drawn into the banner bitmap (xrdp's built-in font is weak).
;
ls_title=
ls_top_window_bg_color=0a0a0a
ls_width=380
ls_height=300
ls_bg_color=171717
ls_background_image=/usr/share/fosos-desktop/xrdp/fosos-rdp-login-bg.bmp
ls_background_transform=scale
ls_logo_filename=/usr/share/fosos-desktop/xrdp/fosos-rdp-login-banner.bmp
ls_logo_transform=none
ls_logo_width=340
ls_logo_height=120
ls_logo_x_pos=20
ls_logo_y_pos=12
; Hide stock labels (banner carries brand + "Sign in").
ls_label_x_pos=-4000
ls_label_width=1
ls_input_x_pos=40
ls_input_width=300
ls_input_height=32
ls_username_y_pos=150
ls_password_y_pos=198
ls_domain_y_pos=0
ls_session_y_pos=0
ls_btn_ok_x_pos=150
ls_btn_ok_y_pos=250
ls_btn_ok_width=100
ls_btn_ok_height=32
ls_btn_cancel_x_pos=260
ls_btn_cancel_y_pos=250
ls_btn_cancel_width=100
ls_btn_cancel_height=32

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=true
SyslogLevel=INFO

[LoggingPerLogger]

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true
tcutils=true

; Single session backend: xorgxrdp → startwm.sh → fosos-session.
; Do not set ip= here — xrdp 0.10 talks to sesman over a UNIX socket.
[FosOS Desktop]
name=FosOS Desktop
lib=libxup.so
username=ask
password=ask
port=-1
code=20

[SessionVariables]
PULSE_SCRIPT=/etc/xrdp/pulse/default.pa
