# FosOS installer sequence. The module order follows Debian's Calamares
# settings, without a package pool on the live medium.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
prompt-install: true
dont-chroot: false

instances:
- id: prepare
  module: shellprocess
- id: sources
  module: shellprocess

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@prepare
  - shellprocess@sources
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: fosos
