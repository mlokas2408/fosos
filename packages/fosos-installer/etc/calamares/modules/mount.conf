---
# Bind the live system's device nodes and kernel interfaces into the
# target. Without these, grub-install fails with
# "cannot find a device for /boot/efi (is /dev mounted?)" and systemctl
# reports that /proc is not mounted.
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
