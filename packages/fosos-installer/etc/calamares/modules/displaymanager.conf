---
displaymanagers:
  - lightdm
defaultDesktopEnvironment:
  executable: "fosos-session"
  # Calamares appends ".desktop" and writes this value as LightDM's
  # user-session. "fosos-desktop.desktop" would look for a session file
  # named fosos-desktop.desktop.desktop, and sign-in would exit 1.
  desktopFile: "fosos-desktop"
basicSetup: false
sysconfigSetup: false
