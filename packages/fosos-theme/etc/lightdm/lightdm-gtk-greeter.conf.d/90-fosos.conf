# Fallback only. The default greeter is fosos-greeter (fosos-desktop).
# Switch with: greeter-session=lightdm-gtk-greeter
[greeter]
background=/usr/share/backgrounds/fosos/fosos-wallpaper.png
background-color=#0c0e12
user-background=false
theme-name=Greybird
icon-theme-name=elementary-xfce
font-name=Inter 11
clock-format=%H:%M
position=50%,50%
indicators=~host;~spacer;~clock;~spacer;~session;~a11y;~power
