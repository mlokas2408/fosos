# FosOS: quiet graphical boot/shutdown after firmware logo → Plymouth → greeter.
# Hold Shift at boot to show the GRUB menu. Hyper-V still adds
# module_blacklist=hyperv_fb via fosos-hyperv.cfg.
# systemd.show_status=false keeps unit stop text off the console.
# Debian trixie kernels lack CONFIG_DRM_SIMPLEDRM and this plymouth build
# has no use-simpledrm; early KMS is loaded via initramfs-tools modules.d
# (fosos-kms). force-frame-buffer-on-boot lets the logo+spinner paint on the
# EFI framebuffer until the real DRM driver appears, avoiding the grey
# three-dot text fallback. ignore-serial-consoles cuts early console flashes.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=false systemd.show_status=false plymouth.force-frame-buffer-on-boot plymouth.ignore-serial-consoles vt.global_cursor_default=0 fbcon=logo-count:0"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_THEME="/usr/share/grub/themes/fosos/theme.txt"
GRUB_GFXPAYLOAD_LINUX=keep
