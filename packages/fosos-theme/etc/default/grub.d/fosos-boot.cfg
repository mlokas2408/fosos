# FosOS: quiet graphical boot/shutdown after firmware logo → Plymouth → greeter.
# Hold Shift at boot to show the GRUB menu. Hyper-V still adds
# module_blacklist=hyperv_fb via fosos-hyperv.cfg.
# systemd.show_status=false keeps unit stop text off the console.
# plymouth.use-simpledrm avoids the grey three-dot text fallback when the
# real GPU driver is not ready yet (Intel/AMD/Hyper-V).
# plymouth.ignore-serial-consoles reduces early console flashes.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=false systemd.show_status=false plymouth.use-simpledrm plymouth.ignore-serial-consoles vt.global_cursor_default=0"
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_THEME="/usr/share/grub/themes/fosos/theme.txt"
GRUB_GFXPAYLOAD_LINUX=keep
